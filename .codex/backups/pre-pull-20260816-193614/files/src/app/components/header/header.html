<header class="site-header">
  <div class="header-main">
    <button
      type="button"
      class="menu-button"
      aria-label="Abrir sites secundarios"
      (click)="abrirSidebar()"
    >
      Menu
    </button>

    <a routerLink="/" class="brand" aria-label="Movune inicio">
      <img src="/logo-transparent.png" alt="Movune" />
    </a>

    <button type="button" class="login-button" (click)="abrirLoginAlert()">Login</button>
  </div>

  <nav class="nav" aria-label="Assuntos da home">
    <a
      *ngFor="let link of primaryLinks"
      [attr.href]="'/#' + link.fragment"
      (click)="navegarParaAssunto($event, link.fragment)"
      [class.is-active]="isActiveFragment(link.fragment)"
    >
      {{ link.label }}
    </a>
  </nav>
</header>

<div class="side-backdrop" *ngIf="sidebarOpen" (click)="fecharSidebar()"></div>

<aside class="side-drawer" *ngIf="sidebarOpen" aria-label="Sites secundarios">
  <div class="drawer-header">
    <strong>Sites secundarios</strong>
    <button type="button" aria-label="Fechar menu" (click)="fecharSidebar()">Fechar</button>
  </div>

  <app-side-bar (click)="fecharSidebar()" />
</aside>

<div class="login-backdrop" *ngIf="loginAlertOpen" (click)="fecharLoginAlert()"></div>

<section class="login-alert" *ngIf="loginAlertOpen" aria-label="Acesso rapido">
  <div class="alert-header">
    <strong>Acessar Movune</strong>
    <button type="button" aria-label="Fechar acesso" (click)="fecharLoginAlert()">Fechar</button>
  </div>

  <p *ngIf="session() as activeSession" class="session-note">
    Sessao ativa: {{ activeSession.nome }}
  </p>

  <label>
    <span>E-mail</span>
    <input
      [(ngModel)]="loginDraft.email"
      autocomplete="email"
      name="quickEmail"
      placeholder="email@exemplo.com"
      type="email"
    />
  </label>

  <fieldset>
    <legend>Tipo de conta</legend>
    <label>
      <input [(ngModel)]="loginDraft.perfil" name="quickPerfil" type="radio" value="usuario" />
      Usuario
    </label>
    <label>
      <input [(ngModel)]="loginDraft.perfil" name="quickPerfil" type="radio" value="ong" />
      ONG
    </label>
  </fieldset>

  <div class="alert-actions">
    <button type="button" class="primary-action" (click)="entrar()">Entrar</button>
    <button type="button" (click)="criarConta()">Criar conta</button>
    <button *ngIf="session()" type="button" (click)="sair()">Sair</button>
  </div>
</section>
