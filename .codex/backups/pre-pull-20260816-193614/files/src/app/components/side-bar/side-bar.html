<aside class="side-bar">
  <img src="/logo-transparent.png" alt="Movune" />

  <div class="access-context" *ngIf="session() as activeSession; else visitorAccess">
    <span>{{ profileLabel(activeSession.perfil) }}</span>
    <strong>{{ activeSession.nome }}</strong>
  </div>

  <ng-template #visitorAccess>
    <div class="access-context">
      <span>Visitante</span>
      <strong>Acesso publico</strong>
    </div>
  </ng-template>

  <section *ngFor="let group of groups()">
    <h2>{{ group.title }}</h2>
    <a
      *ngFor="let link of group.links"
      [routerLink]="link.path"
      routerLinkActive="is-active"
      [routerLinkActiveOptions]="{ exact: link.exact === true }"
    >
      {{ link.label }}
    </a>
  </section>
</aside>
