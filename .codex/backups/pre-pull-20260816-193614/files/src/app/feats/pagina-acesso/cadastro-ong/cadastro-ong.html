<section class="access-page">
  <div class="access-copy">
    <span class="eyebrow">Cadastro de ONG</span>
    <h1>Cadastre a organizacao</h1>
    <p>Registre a ONG para gerenciar projetos, vagas, eventos, documentos e prestacao de contas.</p>
    <img class="brand-mark" src="/logo-slogan-transparent.png" alt="Movune" />
  </div>

  <form class="access-card" (ngSubmit)="cadastrar()">
    <div class="form-grid">
      <label class="field">
        <span>Razao social</span>
        <input
          [(ngModel)]="form.razaoSocial"
          name="razaoSocial"
          placeholder="Razao social da ONG"
          required
        />
      </label>

      <label class="field">
        <span>Nome fantasia</span>
        <input
          [(ngModel)]="form.nomeFantasia"
          name="nomeFantasia"
          placeholder="Nome publico"
          required
        />
      </label>

      <label class="field">
        <span>CNPJ</span>
        <input [(ngModel)]="form.cnpj" name="cnpj" placeholder="00.000.000/0000-00" required />
      </label>

      <label class="field">
        <span>Responsavel legal</span>
        <input
          [(ngModel)]="form.responsavel"
          autocomplete="name"
          name="responsavel"
          placeholder="Nome do responsavel"
          required
        />
      </label>

      <label class="field">
        <span>E-mail institucional</span>
        <input
          [(ngModel)]="form.email"
          autocomplete="email"
          name="email"
          placeholder="ong@exemplo.org"
          required
          type="email"
        />
      </label>

      <label class="field">
        <span>Telefone</span>
        <input
          [(ngModel)]="form.telefone"
          autocomplete="tel"
          name="telefone"
          placeholder="(00) 00000-0000"
          required
        />
      </label>

      <label class="field field--full">
        <span>Endereco</span>
        <input
          [(ngModel)]="form.endereco"
          autocomplete="street-address"
          name="endereco"
          placeholder="Rua, numero, cidade e estado"
          required
        />
      </label>

      <label class="field">
        <span>Area de atuacao</span>
        <select [(ngModel)]="form.areaAtuacao" name="areaAtuacao" required>
          <option *ngFor="let area of areasAtuacao" [ngValue]="area">
            {{ area }}
          </option>
        </select>
      </label>

      <label class="field">
        <span>Documentos enviados</span>
        <input
          [(ngModel)]="form.documentos"
          name="documentos"
          placeholder="CNPJ, estatuto, ata..."
          required
        />
      </label>

      <label class="field">
        <span>Senha</span>
        <input
          [(ngModel)]="form.senha"
          autocomplete="new-password"
          minlength="4"
          name="senha"
          placeholder="Crie uma senha"
          required
          type="password"
        />
      </label>

      <label class="field">
        <span>Confirmar senha</span>
        <input
          [(ngModel)]="form.confirmarSenha"
          autocomplete="new-password"
          name="confirmarSenha"
          placeholder="Repita a senha"
          required
          type="password"
        />
      </label>

      <label class="check-field">
        <input [(ngModel)]="form.aceite" name="aceite" required type="checkbox" />
        <span>Confirmo que os dados informados representam a ONG cadastrada.</span>
      </label>

      <p
        *ngIf="message"
        class="message"
        [class.message--error]="feedback === 'error'"
        [class.message--success]="feedback === 'success'"
      >
        {{ message }}
      </p>

      <div class="submit-row">
        <button type="submit">Cadastrar ONG</button>
      </div>

      <div class="access-links">
        <a routerLink="/login">Ja tenho conta</a>
        <a routerLink="/politica-transparencia">Politica de transparencia</a>
      </div>
    </div>
  </form>
</section>
