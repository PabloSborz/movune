@if (!isLogin() && !isAccessPage()) {
  <app-header [home]="isHome()" [authenticatedHome]="isAuthenticatedHome()" />
}

<main
  class="app-main"
  [class.app-main--home]="isHome()"
  [class.app-main--login]="isLogin() || isAccessPage()"
>
  <router-outlet />
</main>

@if (choiceDialog.isOpen()) {
  <app-escolha [modal]="true" />
}

@if (!isLogin() && !isAccessPage()) {
  @if (!isAuthenticatedHome()) {
    <app-footer [home]="isHome()" />
  }
}
