<footer class="movune-footer">
  <div class="footer-grid">
    <div class="footer-about">
      <a routerLink="/" class="footer-brand" aria-label="Movune, início">
        <img src="/logo-transparent.png" alt="" />
        <span>Movune</span>
      </a>
      <p>
        Conectando corações dispostos a transformar realidades locais através do poder coletivo.
      </p>
    </div>

    <nav *ngFor="let group of homeGroups" [attr.aria-label]="group.title">
      <h2>{{ group.title }}</h2>
      <a *ngFor="let link of group.links" [routerLink]="link.href">{{ link.label }}</a>
    </nav>
  </div>

  <div class="footer-bottom">
    <div>
      <span>© 2026 Movune. Mover pessoas. Unir causas.</span>
      <span>Feito para gerar impacto real.</span>
    </div>
  </div>
</footer>
