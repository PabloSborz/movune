<div class="user-area">
  <svg class="icon-sprite" aria-hidden="true" xmlns="http://www.w3.org/2000/svg">
    <symbol id="user-icon-profile" viewBox="0 0 24 24">
      <circle cx="12" cy="8" r="4" />
      <path d="M4 21a8 8 0 0 1 16 0" />
    </symbol>
    <symbol id="user-icon-calendar" viewBox="0 0 24 24">
      <rect x="3" y="5" width="18" height="16" rx="2" />
      <path d="M7 3v4m10-4v4M3 10h18m-13 5 2 2 4-4" />
    </symbol>
    <symbol id="user-icon-coins" viewBox="0 0 24 24">
      <circle cx="8" cy="8" r="5" />
      <path
        d="M3 8v5c0 2.8 2.2 5 5 1.3 0 2.5-.5 3.4-1.3M14 4h3a5 5 0 0 1 0 10h-3M14 9h3M14 14v5c0 1.1 1.3 2 3 2s3-.9 3-2v-5"
      />
    </symbol>
    <symbol id="user-icon-heart" viewBox="0 0 24 24">
      <path
        d="M20.8 5.6a5.5 5.5 0 0 0-7.8 0L12 6.7l-1.1-1.1a5.5 5.5 0 0 0-7.8 7.8L12 22l8.8-8.6a5.5 5.5 0 0 0 0-7.8Z"
      />
    </symbol>
    <symbol id="user-icon-award" viewBox="0 0 24 24">
      <circle cx="12" cy="8" r="5" />
      <path d="m8 12-1 9 5-3 5 3-1-9" />
    </symbol>
    <symbol id="user-icon-exit" viewBox="0 0 24 24">
      <path d="M10 3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h5M14 7l5 5-5 5m5-5H9" />
    </symbol>
  </svg>

  <header class="user-header">
    <button
      type="button"
      class="header-back"
      (click)="voltar()"
      aria-label="Voltar à página anterior"
    >
      <span>Voltar</span>
    </button>
    <a class="brand" [routerLink]="session() ? '/inicio' : '/'" aria-label="Movune, início"
      ><img src="/logo-transparent.png" alt="" /><span>Movune</span></a
    >
    <nav class="global-nav" [class.is-open]="navOpen" aria-label="Navegação principal">
      @for (link of navLinks; track link.path) {
        <a [routerLink]="link.path">{{ link.label }}</a>
      }
    </nav>
    <div class="header-actions">
      <button
        type="button"
        class="notification-button"
        aria-label="Notificações"
        [attr.aria-expanded]="noticeOpen"
        (click)="noticeOpen = !noticeOpen"
      >
        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.8"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9ZM10 21h4" />
        </svg>
      </button>
      @if (noticeOpen) {
        <div class="notification-popover" role="status">Você não tem novas notificações.</div>
      }
      <span class="header-name">{{ session()?.nome }}</span>
      <app-profile-menu [initials]="initials" [photo]="user()?.avatar || ''" />
      <button
        type="button"
        class="header-menu"
        aria-label="Abrir navegação"
        [attr.aria-expanded]="navOpen"
        (click)="navOpen = !navOpen"
      >
        ☰
      </button>
    </div>
  </header>

  <div class="user-layout">
    <aside class="user-sidebar" [class.is-open]="sidebarOpen" aria-label="Área do usuário">
      <nav class="side-nav">
        <a routerLink="/usuario/meu-perfil" routerLinkActive="is-active"
          ><svg><use href="#user-icon-profile" /></svg>Meu Perfil</a
        >
        <a routerLink="/usuario/minhas-inscricoes" routerLinkActive="is-active"
          ><svg><use href="#user-icon-calendar" /></svg>Minhas Inscrições</a
        >
        <a routerLink="/usuario/minhas-doacoes" routerLinkActive="is-active"
          ><svg><use href="#user-icon-coins" /></svg>Minhas Doações</a
        >
        <a routerLink="/usuario/favoritos" routerLinkActive="is-active"
          ><svg><use href="#user-icon-heart" /></svg>Favoritos</a
        >
        <a routerLink="/usuario/certificados" routerLinkActive="is-active"
          ><svg><use href="#user-icon-award" /></svg>Certificados</a
        >
      </nav>
      <button type="button" class="logout-button" (click)="logout()">
        <svg><use href="#user-icon-exit" /></svg>Sair
      </button>
    </aside>

    <div class="user-content">
      <div class="content-heading">
        <div class="heading-title">
          <button
            type="button"
            class="sidebar-toggle"
            aria-label="Abrir menu do usuário"
            [attr.aria-expanded]="sidebarOpen"
            (click)="sidebarOpen = !sidebarOpen"
          >
            ☰
          </button>
          <h1>{{ title }}</h1>
        </div>
        <ng-content select="[page-actions]" />
      </div>
      <ng-content select="[page-body]" />
    </div>
  </div>
</div>
