<section class="access-page">
  <div class="access-copy">
    <span class="eyebrow">Acesso</span>
    <h1>Entrar na Movune</h1>
    <p>Use seu cadastro de usuario, ONG ou o acesso administrativo para abrir o painel correto.</p>
    <img class="brand-mark" src="/logo-transparent.png" alt="Movune" />
  </div>

  <form class="access-card" autocomplete="off" (ngSubmit)="entrar()">
    <div class="form-grid">
      <label class="field field--full">
        <span>Perfil de acesso</span>
        <select [(ngModel)]="form.perfil" name="perfil" required>
          <option *ngFor="let perfil of perfis" [ngValue]="perfil.value">
            {{ perfil.label }}
          </option>
        </select>
      </label>

      <label class="field field--full">
        <span>{{ form.perfil === 'admin' ? 'Usuario administrador' : 'E-mail' }}</span>
        <input
          appDisableAutofill
          [(ngModel)]="form.identificador"
          [placeholder]="form.perfil === 'admin' ? 'admin' : 'email@exemplo.com'"
          name="manualLoginIdentity"
          required
        />
      </label>

      <label class="field field--full">
        <span>Senha</span>
        <input
          appDisableAutofill
          [(ngModel)]="form.senha"
          name="manualLoginSecret"
          placeholder="Digite sua senha"
          required
          type="password"
        />
      </label>

      <p
        *ngIf="message"
        class="message"
        [class.message--error]="feedback === 'error'"
        [class.message--success]="feedback === 'success'"
      >
        {{ message }}
      </p>

      <div class="submit-row">
        <button type="submit">Entrar</button>
      </div>

      <div class="access-links">
        <a routerLink="/cadastro-usuario">Cadastrar usuario</a>
        <a routerLink="/cadastro-ong">Cadastrar ONG</a>
        <a routerLink="/recuperacao-senha">Recuperar senha</a>
      </div>
    </div>
  </form>
</section>
