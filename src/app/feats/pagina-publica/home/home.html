<div id="inicio" class="home-anchor">
  <app-feature-page class="metrics-centered" [page]="page" />
</div>

<section class="home-summary" aria-label="Principais caminhos da Movune">
  <article *ngFor="let summary of summaries" [id]="summary.id" class="summary-block">
    <div class="summary-copy">
      <span>{{ summary.eyebrow }}</span>
      <h2>{{ summary.title }}</h2>
      <p>{{ summary.description }}</p>
      <a [attr.href]="summary.actionPath" [attr.aria-label]="summary.actionLabel + ': ' + summary.title">
        {{ summary.actionLabel }}
      </a>
    </div>

    <ul aria-label="Destaques do caminho">
      <li *ngFor="let item of summary.highlights">{{ item }}</li>
    </ul>
  </article>
</section>
