<div class="landing">
  <section id="inicio" class="hero">
    <div class="container hero-inner">
      <div class="hero-copy">
        <span class="hero-eyebrow">● &nbsp; MOVER PESSOAS. UNIR CAUSAS.</span>
        <h1>Uma nova era de <em>impacto social coletivo</em></h1>
        <p>
          A Movune é uma plataforma para aproximar pessoas, empresas e ONGs em projetos sociais com
          total transparência, doações auditadas e voluntariado transformador.
        </p>
        <div class="hero-actions">
          <a href="/doacoes" class="button button-white"
            >Doar agora <span aria-hidden="true">→</span></a
          ><a href="/voluntariado" class="button button-outline-white">Ser voluntário</a
          ><a href="/cadastro-ong" class="button button-outline-white">Cadastrar ONG</a>
        </div>
      </div>
      <div class="hero-media">
        <img
          src="/hero-image-frame.png"
          alt="Grupo diverso de voluntários reunidos em um parque"
          fetchpriority="high"
        />
      </div>
    </div>
  </section>
  <app-home-content></app-home-content>
</div>
